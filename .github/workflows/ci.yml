name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m varilab demo > /tmp/demo.json
      - run: PYTHONPATH=. python examples/render_audit.py --check
      - run: python -m varilab exact examples/coupled.json
      - run: python -m varilab compare examples/coupled.json --initial '[0.1,0.1]'
      - run: python -m varilab curvature-demo
      - run: python -m varilab curvature examples/coupled.json --means '[0,0]'
      - run: PYTHONPATH=. python examples/render_curvature.py --check
      - run: python -m varilab forest-demo > /tmp/forest-demo.json
      - run: python -m varilab forest examples/coupled.json --evidence '[{"i":0,"spin":1}]'
      - run: PYTHONPATH=. python examples/render_forest.py --check
      - run: python -m varilab map-demo > /tmp/map-demo.json
      - run: python -m varilab map examples/coupled.json --evidence '[{"i":0,"spin":1}]'
      - run: PYTHONPATH=. python examples/render_map.py --check
