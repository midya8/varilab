<text x="35" y="535" font-size="16" style="fill:#e7edf8">Green: conditioned mean tanh(2)^distance. Amber baseline: prior mean 0, a different query.</text>
<text x="35" y="565" font-size="16" style="fill:#e7edf8">P(spin 0 = +1) = 0.5. Endpoint &gt; 0.8 gate passes with evidence and fails without it.</text>
<text x="35" y="595" font-size="15" style="fill:#b7c4d9">128-node chain: 254 directed messages, no full-state enumeration. Only acyclic graphs are accepted.</text>
<text x="35" y="623" font-size="15" style="fill:#b7c4d9">Supplied-model conditioning, not causal intervention. Float log-sum-exp; possible underflow retains finite logs.</text>
<text x="35" y="649" font-size="14" style="fill:#b7c4d9">Display geometry uses analytic values rounded to 12 decimals; full float messages are returned by the demo.</text>
